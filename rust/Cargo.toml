[package]
name = "zoot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Pareto-optimal pretty printer"

[lib]
path = "src/lib.rs"

[features]
rust-format = ["dep:ra_ap_syntax"]

[dependencies]
ra_ap_syntax = { version = "=0.0.349", optional = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
